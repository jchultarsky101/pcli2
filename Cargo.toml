[package]
name = "pcli2"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Julian Chultarsky <jchultarsky@physna.com>"]
description = "CLI client for the Physna public API - Advanced 3D Geometry Search and Analysis"
repository = "https://github.com/jchultarsky101/pcli2"
homepage = "https://jchultarsky101.github.io/pcli2/"

[package.metadata.wix]
upgrade-guid = "1A4B1568-B3A4-4FF3-8F28-7794C0181133"
path-guid = "A39581CB-4F22-4BBD-8FA8-4B99D16D6788"
license = false
eula = false

[features]
default = ["dev-keyring"]
dev-keyring = []

[dependencies]
clap = { version = "4.5.45", features = ["derive", "env", "string"] }
color-print = "0.3.4"
dirs = "5.0.1"
thiserror = "1.0.69"
serde_yaml = "0.9.34"
serde = { version = "1.0.219", features = ["derive"] }
urlencoding = "2.1.0"
reqwest = { version = "0.12.23", features = ["json", "multipart", "stream"] }
serde_urlencoded = "0.7.1"
strum = { version = "0.26.2", features = ["strum_macros", "derive"] }
serde_json = "1.0.143"
keyring = { version = "2.3.3" }
base64 = "0.22.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = "0.1"
bytes = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
clap_complete = "4.5.1"
clap_mangen = "0.2"
csv = "1.3.0"
inquire = "0.7.5"
ptree = "0.4.0"
glob = "0.3"
indicatif = "0.17"
futures = "0.3"
zip = "2.1"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
rand = "0.8"
mime_guess = "2.0"
rust_xlsxwriter = "0.95.0"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
mockito = "1.6.1"
tempfile = "3.10.1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

