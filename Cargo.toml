[package]
name = "pcli2"
version = "2.4.2"
edition = "2021"
rust-version = "1.88"
authors = ["Julian Chultarsky <jchultarsky@physna.com>"]
description = "CLI client for the Physna public API - Advanced 3D Geometry Search and Analysis"
repository = "https://github.com/jchultarsky101/pcli2"
homepage = "https://jchultarsky101.github.io/pcli2/"

[package.metadata.wix]
upgrade-guid = "1A4B1568-B3A4-4FF3-8F28-7794C0181133"
path-guid = "A39581CB-4F22-4BBD-8FA8-4B99D16D6788"
license = false
eula = false

[features]
default = ["dev-keyring"]
# Credentials in a plaintext file next to config.yml (the shipped behaviour).
dev-keyring = []
# Credentials in the operating system's keychain instead:
# `cargo build --no-default-features --features os-keyring`.
os-keyring = ["dep:keyring"]

[dependencies]
clap = { version = "4.5.45", features = ["derive", "env", "string", "wrap_help"] }
color-print = "0.3.4"
dirs = "7.0.0"
thiserror = "2.0.20"
serde_norway = "0.9.42"
serde = { version = "1.0.219", features = ["derive"] }
urlencoding = "2.1.0"
# native-tls as before (0.13 defaults to rustls): the OS certificate store and TLS stack
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy", "json", "form", "multipart", "stream"] }
serde_urlencoded = "0.7.1"
strum = { version = "0.28.0", features = ["strum_macros", "derive"] }
serde_json = "1.0.143"
keyring = { version = "4.2", optional = true }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = "0.1"
bytes = "1.0"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
clap_complete = "4.5.1"
clap_mangen = "0.3"
csv = "1.3.0"
inquire = "0.9"
ptree = { version = "0.5.2", default-features = false }
glob = "0.3"
indicatif = "0.18"
futures = "0.3"
zip = { version = "8.6", default-features = false, features = ["bzip2", "deflate", "deflate64", "lzma", "ppmd", "time", "xz", "zstd"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
rand = "0.10"
mime_guess = "2.0"
rust_xlsxwriter = "0.99.1"

[dev-dependencies]
assert_cmd = "2.0.14"
predicates = "3.1.0"
mockito = "1.6.1"
tempfile = "3.10.1"
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "benchmarks"
harness = false

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

