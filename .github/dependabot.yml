# Monthly dependency updates. The msrv job in rust.yml catches an update that
# needs a newer Rust than rust-version in Cargo.toml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Major versions need code changes and a close look (e.g. keyring and
      # the credential store); they are upgraded by hand, a batch at a time.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    # release.yml is generated by cargo-dist (`dist init` rewrites it, and
    # `dist plan` fails when it is edited by hand).
    exclude-paths:
      - .github/workflows/release.yml
    ignore:
      # Pinned to the MSRV on purpose; the tag is a Rust version, not a release.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns: ["*"]
