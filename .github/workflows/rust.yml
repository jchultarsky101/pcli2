name: Rust

# `develop` is a `pull_request` target but deliberately not a `push` one.
# GitFlow makes it the branch feature work actually lands on - a feature PR
# targets `develop`, and `main` only sees an already-merged release PR - so
# gating those PRs is what stops a change reaching `main` unverified.
#
# It is left off `push` because `develop` would then match both triggers, and
# every commit produced two identical Rust runs. Branch protection on `main`
# waits for each check name it sees, so a release PR blocked on a duplicate
# 3-OS matrix that told it nothing the first had not (observed on #107).
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format check
  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Check formatting
      run: cargo fmt --all -- --check

  # Clippy lint check
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev cmake
    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

  # Known vulnerabilities in the dependency tree. Warnings about unmaintained
  # crates are reported but do not fail the job; vulnerabilities do.
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: taiki-e/install-action@cargo-audit
    - name: Audit dependencies
      run: cargo audit

  # The oldest toolchain the crate promises to build with (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust 1.85
      uses: dtolnay/rust-toolchain@1.85
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev cmake
    - name: Check
      run: cargo check --all-targets

  # Build and test
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev cmake
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install --quiet openssl cmake
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  # Coverage report (optional, runs on main branch only)
  coverage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build-and-test]
    steps:
    - uses: actions/checkout@v6
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev cmake
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov
    - name: Generate coverage report
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        fail_ci_if_error: false
